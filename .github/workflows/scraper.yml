name: Automated Internship Scraper

on:
  push:
    branches:
      - Postgres-fix
  schedule:
    # Runs every 15 minutes automatically
    - cron: '*/15 * * * *'
  # Allows you to click a "Run workflow" button manually anytime
  workflow_dispatch: 

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      # Step A: Download your repository code into the runner
      - name: Check out repository code
        uses: actions/checkout@v4

      # Step B: Set up Python 3.11 on the virtual machine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step C: Install your project requirements
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 psycopg2-binary python-dotenv

      # Step D: Run Scraper.py using the secrets stored in GitHub
      - name: Run Scraper Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_PASSWORD: ${{ secrets.ALERT_PASSWORD }}
          ALERT_RECEIVER: ${{ secrets.ALERT_RECEIVER }}
        run: python Scraper.py